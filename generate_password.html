<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="generate_password_style.css">
</head>
<body>
    
    <div class="container">
        <h1>Generate a <br> <span> Random Password </span></h1>
        <div class="display">
            <input type="text" class="Password" placeholder="Password">
            <img onclick="copyPassword()" src="rpg_img/images/copy.png" alt="copy" >            
        </div>
        <button onclick="createPassword()"><img src="rpg_img/images/generate.png" alt="">Generate Password</button>
    </div>


    <script>
        const passwordBox = document.querySelector('.Password')
        const length = 12;

        const upperCase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        const lowerCase = "abcdefghijklmnopqrstuvwxyz"
        const number = "0123456789"
        const symbol = "!@#$%^&*()_-+=[]{}|;:'\",.<>?/`~\\"

        const allChars = upperCase + lowerCase + number + symbol

        function createPassword(){
            let Password = ""
            Password += upperCase[Math.floor(Math.random()*upperCase.length)]
            Password += lowerCase[Math.floor(Math.random()*lowerCase.length)]
            Password += number[Math.floor(Math.random()*number.length)]
            Password += symbol[Math.floor(Math.random()*symbol.length)]

            while(length > Password.length){
                Password += allChars[Math.floor(Math.random()*allChars.length)]
            }
            passwordBox.value = Password
        }

        function copyPassword(){
            passwordBox.select()
            document.execCommand("copy")
        }

    </script>
</body>
</html>
