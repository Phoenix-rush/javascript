<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="music_player_style.css">
    <script src="https://kit.fontawesome.com/396d14c7d9.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="container">
        <div class="music-player">
            <nav>
                <div class="circle">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="circle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
            <img src="468-thumbnail.png" class="song-img">
            <h1>Despacito</h1>
            <p>Luis Fonsi Ft. Puerto Rican</p>
            <audio  class="song">
            <source src="Justin-Bieber-Despacito-Lyrics-⧸-Letra-ft.-Luis-Fonsi-Daddy-Yankee-TfkP5ubz1z4-140-audio-only-1733648957id (1).mp3" type="audio/mpeg">
        </audio>
        <input type="range" value="0" class="progress">

        <div class="controls">
            <div><i class="fa-solid fa-backward"></i></div>
            <div onclick="playPause()" ><i class="fa-solid fa-play" id="cntrlIcon"></i></div>
            <div><i class="fa-solid fa-forward"></i></div>
        </div>

        </div>
    </div>


    <script>

        let progress = document.querySelector('.progress')
        let song = document.querySelector('.song')
        let cntrlIcon = document.getElementById("cntrlIcon")

        song.onloadedmetadata = function(){
            progress.max = song.duration
            progress.value = song.currentTime
        }

        function playPause(){
            if(cntrlIcon.classList.contains('fa-pause')){
                song.pause()
                cntrlIcon.classList.remove('fa-pause')
                cntrlIcon.classList.add('fa-play')
            }
            else{
                song.play()
                cntrlIcon.classList.add('fa-pause')
                cntrlIcon.classList.remove('fa-play')
            }
        }

        if(song.play()){
            setInterval(()=>{
                progress.value = song.currentTime
            },500)
        }

        progress.onchange = function(){
            song.play()
            song.currentTime = progress.value
            cntrlIcon.classList.add('fa-pause')
            cntrlIcon.classList.remove('fa-play')
        }

    </script>
    
</body>
</html>
